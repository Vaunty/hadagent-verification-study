   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="43.2" y="42.917422" transform="rotate(-0 43.2 42.917422)">HADAGENT / THE VERIFICATION QUESTION</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="43.2" y="88.915781" transform="rotate(-0 43.2 88.915781)">A correct answer does not identify the model that ran</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526279" x="43.2" y="124.937188" transform="rotate(-0 43.2 124.937188)">The controlled local test asks whether the verifier can distinguish model execution from a known-answer lookup.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="57.6" y="228.879375" transform="rotate(-0 57.6 228.879375)">01  A model is claimed</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 253.205312)">Signed submission</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 269.705312)">Names a model and an endpoint</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="329.76" y="228.879375" transform="rotate(-0 329.76 228.879375)">02  The verifier asks</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(329.76 253.205312)">Benchmark questions go to</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(329.76 269.705312)">the supplied endpoint</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="601.92" y="227.523125" transform="rotate(-0 601.92 227.523125)">03  A lookup answers</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(601.92 254.270938)">Known labels are returned</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(601.92 270.770938)">The named model does not run</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="874.08" y="227.523125" transform="rotate(-0 874.08 227.523125)">04  The check passes</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(874.08 253.205312)">Original and isolated repair</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(874.08 269.705312)">both accept this local fixture</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="57.6" y="407.325" transform="rotate(-0 57.6 407.325)">What this demonstrates</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 430.63125)">A passing score check can coexist with no execution</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 448.63125)">of the named model in the copied local prototype.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="590.4" y="405.7125" transform="rotate(-0 590.4 405.7125)">Why the distinction matters</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(590.4 430.63125)">If trust or payment depends on model identity,</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(590.4 448.63125)">that identity needs evidence beyond correct answers.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526279" x="57.6" y="534.718125" transform="rotate(-0 57.6 534.718125)">Scope: synthetic lookup participant; measured local validator decisions. No deployed network or reward system tested.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(43.2 615.059375)">Evidence: P012 known-answer control, commit 9de5ac5. The score repair addresses arithmetic, not model binding.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(43.2 630.059375)">Conceptual interpretation of a controlled test; no claim of general exploit prevalence or novelty.</text>
   </g>
  </g>
 </g>
