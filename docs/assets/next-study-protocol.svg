   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="43.2" y="42.917422" transform="rotate(-0 43.2 42.917422)">NEXT STUDY / PROPOSED AND UNRUN</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="43.2" y="88.915781" transform="rotate(-0 43.2 88.915781)">Compare score-only verification with a verifier-controlled reference</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526279" x="43.2" y="124.937188" transform="rotate(-0 43.2 124.937188)">Proposed next study · paired decisions on sealed held-out prompts · protocol only; no experiment has been run.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="57.6" y="224.384687" transform="rotate(-0 57.6 224.384687)">01  Calibrate, then freeze</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 249.092344)">Find an eligible honest target. Fix the</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 264.842344)">agreement rule, threshold, and stop rules.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="432" y="225.279375" transform="rotate(-0 432 225.279375)">02  Commit the contract</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(432 249.092344)">Artifact, task, decode, runtime, endpoint,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(432 264.842344)">and context hashes enter the signed ledger.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="806.4" y="223.923125" transform="rotate(-0 806.4 223.923125)">03  Reveal held-out prompts</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(806.4 249.092344)">Keep final challenges sealed until the</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(806.4 264.842344)">endpoint, candidates, and thresholds are fixed.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="57.6" y="358.049062" transform="rotate(-0 57.6 358.049062)">Copied baseline · candidate endpoint</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 382.805312)">The verifier queries the endpoint named in the PROOF,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 399.305312)">recomputes task score, then applies  B = score ≥ threshold.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="604.8" y="357.990469" transform="rotate(-0 604.8 357.990469)">Proposed audit · verifier-controlled target</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(604.8 382.805312)">Send the same challenge to candidate and committed reference;</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(604.8 399.305312)">apply  R = B  AND  output agreement ≥ frozen threshold.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526279" x="43.2" y="440.64" transform="rotate(-0 43.2 440.64)">PAIRED CANDIDATE ARMS AND CONTROLS</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="57.6" y="507.346406" transform="rotate(-0 57.6 507.346406)">Eligible honest target</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 533.223609)">Exact committed artifact;</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(57.6 547.474187)">must qualify and stay accepted.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="331.2" y="508.656562" transform="rotate(-0 331.2 508.656562)">Alternate model</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(331.2 533.223609)">Preselected on calibration; useful</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(331.2 547.474187)">only if it passes the score gate.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="604.8" y="507.397187" transform="rotate(-0 604.8 507.397187)">Cache / lookup</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(604.8 532.774187)">Calibration examples only; final</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(604.8 547.474187)">challenges remain sealed.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14243b" x="878.4" y="507.146328" transform="rotate(-0 878.4 507.146328)">Target proxy</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(878.4 532.774187)">Expected to pass; exposes the</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(878.4 548.423563)">fresh-work limitation.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(43.2 615.059375)">Commitments make the declared contract tamper-evident; they do not prove that the candidate ran it. A passing proxy shows output consistency, not fresh prover work.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #526279" transform="translate(43.2 630.059375)">PROPOSED / UNRUN: no model, paid compute, consensus network, or deployed system tested; not reviewed or approved by Dr. Boyang Li.</text>
   </g>
  </g>
 </g>
